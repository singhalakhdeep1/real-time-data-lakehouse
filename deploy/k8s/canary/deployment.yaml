apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-time-data-lakehouse-worker-canary
  namespace: prod
  labels:
    app: real-time-data-lakehouse-worker
    track: canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-time-data-lakehouse-worker
      track: canary
  template:
    metadata:
      labels:
        app: real-time-data-lakehouse-worker
        track: canary
        version: canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: ghcr.io/alakhdeepsingh/real-time-data-lakehouse:canary
          command: ["python", "jobs/run_local_demo.py"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: ENV
              value: "canary"
            - name: LOG_LEVEL
              value: "DEBUG"
